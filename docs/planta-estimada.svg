<text x="45" y="770">Escala do modelo: 20 × 30 m; beiral 5,2 m; cumeeira 7,7 m. Todos esses valores são hipóteses ajustáveis.</text>
<text x="45" y="798">Orientação dos eixos é convenção do projeto; não indica norte geográfico. Ligação entre setores ainda não comprovada.</text>
